<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rap Flow Idea Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="controls">
            <button id="generate-flow">Generate Flow</button>
            <select id="rap-style-select">
                <option value="boombap">Boom Bap</option>
                <option value="trap">Trap</option>
                <option value="mumble">Mumble</option>
                <option value="conscious">Conscious</option>
                <option value="grime">Grime</option>
                <option value="experimental-flow">Experimental Flow</option>
                <option value="flow-fusion">Flow Fusion</option>
            </select>
            <button id="randomize-style">Randomize Current Style</button>
            <label for="flow-speed-input">Flow Speed:</label>
            <input type="number" id="flow-speed-input" value="100" min="50" max="180">
            <button id="play-stop">Play</button>
            <button id="export-pattern">Export Pattern (Text)</button>
        </header>

        <main class="grid-container">
            <div id="playhead"></div>
            <div id="flow-grid">
                <!-- Grid will be generated by JavaScript -->
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <!-- MidiWriter.js is not strictly needed for flow, but Tone.js might be kept for optional simple audio cues -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/midi-writer-js@2.1.4/build/MidiWriter.min.js"></script> -->
    <script type="module" src="flow_generator.js"></script>
    <script type="module" src="flow_app.js"></script>
</body>
</html>
